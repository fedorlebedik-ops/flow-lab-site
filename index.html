    <video class="hero-vid" autoplay muted playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1">
      <source src="video/flow_hero_full.webm" type="video/webm">
      <source src="video/flow_hero_full.mp4" type="video/mp4">
    </video>
    <div class="hero-scrim"></div>
  </div>
  <div class="fs-glow" aria-hidden="true" style="position: absolute; left: -18%; bottom: -55%; width: 95%; height: 140%; border-radius: 50%; background: radial-gradient(closest-side, #F0782F 0%, #C4421E 32%, rgba(140,40,14,0.55) 60%, rgba(27,22,19,0) 100%); filter: blur(10px); pointer-events: none"></div>
  <div class="fs-glow" aria-hidden="true" style="position: absolute; right: -20%; top: -40%; width: 60%; height: 90%; border-radius: 50%; background: radial-gradient(closest-side, rgba(232,160,106,0.35) 0%, rgba(196,66,30,0.18) 45%, rgba(27,22,19,0) 100%); pointer-events: none"></div>

  <nav class="fl-nav" aria-label="Главное меню">
    <a class="fl-logo" href="#top">Flow&#160;Lab</a>
    <div class="fl-links"><a href="#buttons">Что автоматизируем</a><a href="/kak-rabotaem/">Как мы работаем</a><a href="#price">Стоимость</a><a href="#faq">Вопросы</a><a href="/kontakty/">Контакты</a></div>
    <div class="fl-right"><a class="fl-call" href="#form">Записаться на&#160;созвон</a><button type="button" class="fl-menu-btn" data-fl-menu="open" aria-controls="fl-menu" aria-expanded="false">Меню</button></div>
  </nav>

  <div id="top" style="position: relative; max-width: 1200px; margin: 0 auto; padding: clamp(48px, 9vw, 120px) clamp(16px, 4vw, 48px) clamp(64px, 10vw, 140px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end">
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <p style="margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #E8A06A">[ лаборатория автоматизации рабочей документации в&#160;Revit ]</p>
      <h1 style="margin: 0; font-weight: 600; font-size: clamp(34px, 6.6vw, 92px); line-height: 0.98; letter-spacing: 0.01em; text-transform: uppercase">Освободим команду от&#160;рутины в&#160;Revit</h1>
      <p style="margin: 0; max-width: 640px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: clamp(22px, 2.6vw, 32px); line-height: 1.22; color: #F1D9C4">Настроим кнопки под EIR вашего проекта: модель проходит проверку заказчика, а&#160;люди занимаются архитектурой.</p>
      <p style="margin: 0; max-width: 560px; font-size: 16px; line-height: 1.55; color: rgba(244,244,240,0.86)">Начнём с&#160;одного этажа, чтобы вы увидели результат на&#160;своей модели.</p>

      <div style="display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; margin-top: 4px">
        <a href="#form" style="display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 30px; border-radius: 999px; background: #E8A06A; color: #1B1613; text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase">Записаться на созвон <span aria-hidden="true">→</span></a>
      </div>
    </div>

  </div>
</header>

<!-- ═══════════ ПЕРЕХОД ИЗ ТЁМНОГО ═══════════ -->
<div class="v3-fade-down" aria-hidden="true"></div>

<!-- ═══════════ ЧТО МЫ ДЕЛАЕМ ═══════════ -->
<section id="what" aria-labelledby="what-h" class="v3-sec v3-split">
  <div class="v3-side">
    <div style="display: flex; align-items: flex-start; gap: 20px">
      <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613; margin-top: 0.62em"></span>
      <h2 id="what-h" class="v3-h2">Что мы делаем</h2>
    </div>
    <figure class="q-fig" aria-hidden="true"><div class="q-img"><img src="img/quiet_plan.jpg" alt="" loading="lazy" decoding="async" width="720" height="900"></div></figure>
  </div>
  <ol class="v3-list">
    <li><span class="v3-n" aria-hidden="true">01</span><div><h3>Кнопки под ваш EIR.</h3><p>Отделка, полы, потолки, марки, ведомости и&#160;тиражирование этажей одним нажатием.</p></div></li>
    <li><span class="v3-n" aria-hidden="true">02</span><div><h3>Модель проходит проверку.</h3><p>Самопроверка по&#160;EIR показывает, что поправить, до&#160;отправки заказчику.</p></div></li>
    <li><span class="v3-n" aria-hidden="true">03</span><div><h3>Ведём до&#160;сдачи.</h3><p>Шаблон, BEP, правки и&#160;замечания заказчика берём на&#160;себя.</p></div></li>
  </ol>
</section>

<!-- ═══════════ ЛЕНТА REVIT ═══════════ -->
<section id="buttons" aria-labelledby="rib-h" style="max-width: 1200px; margin: 0 auto; padding: clamp(64px, 8vw, 110px) clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">
  <div style="display: flex; flex-wrap: wrap; gap: 20px 64px; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 20px">
      <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613"></span>
      <h2 id="rib-h" style="margin: 0; font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em">Вкладка Flow в&#160;вашем Revit</h2>
    </div>
    <p style="margin: 0; max-width: 520px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 24px; line-height: 1.25; color: #5E544D">Пример из&#160;нашей работы. Нажмите на&#160;кнопку.</p>
  </div>

  <!-- макет окна: Revit 2022, светлая тема; вкладка Flow -->
  <div class="rv-win">
    <div class="rv-title">
      <span class="rv-logo" aria-hidden="true">R</span>
      <span class="rv-qat" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="rv-tt">Autodesk Revit 2022 · Демо-модель.rvt · План этажа: 3 этаж</span>
    </div>
    <div class="rv-scroll" style="padding-bottom: {{rvPad}}">
      <div class="rv-tabs" aria-hidden="true">
        <span class="rv-file">Файл</span>
        <sc-for list="{{rvTabs}}" as="t"><span>{{t}}</span></sc-for>
        <span class="rv-on">Flow</span>
      </div>
      <div class="rv-ribbon" role="toolbar" aria-label="Вкладка Flow">
        <sc-for list="{{rvPanels}}" as="pn">
          <div class="rv-panel">
            <div class="rv-body">
              <sc-for list="{{pn.cols}}" as="c">
                <sc-if value="{{c.isBig}}">
                  <div class="rv-bigwrap">
                    <button type="button" class="rv-big" onClick="{{c.b.pick}}" aria-pressed="{{c.b.pressed}}" aria-expanded="{{c.b.expanded}}">
                      <img src="{{c.b.img}}" width="32" height="32" alt="">
                      <span>{{c.b.label}}</span>
                      <sc-if value="{{c.b.isDrop}}"><span class="rv-caret" aria-hidden="true">▾</span></sc-if>
                    </button>
                    <sc-if value="{{c.b.open}}">
                      <div class="rv-menu" role="menu">
                        <sc-for list="{{c.b.items}}" as="it">
                          <button type="button" role="menuitem" class="rv-mi" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}"><img src="{{it.img}}" width="16" height="16" alt="">{{it.label}}</button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{c.isStack}}">
                  <div class="rv-stack">
                    <sc-for list="{{c.items}}" as="m">
                      <div class="rv-bigwrap">
                        <button type="button" class="rv-small" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" aria-expanded="{{m.expanded}}"><img src="{{m.img}}" width="16" height="16" alt="">{{m.label}}<sc-if value="{{m.isDrop}}"><span class="rv-caret" aria-hidden="true">▾</span></sc-if></button>
                        <sc-if value="{{m.open}}">
                          <div class="rv-menu" role="menu">
                            <sc-for list="{{m.items}}" as="it">
                              <button type="button" role="menuitem" class="rv-mi" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}"><img src="{{it.img}}" width="16" height="16" alt="">{{it.label}}</button>
                            </sc-for>
                          </div>
                        </sc-if>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
              </sc-for>
            </div>
            <div class="rv-ptitle">{{pn.title}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- результат нажатия -->
    <div class="rv-out" aria-live="polite">
      <img src="{{rvCur.img}}" width="48" height="48" alt="">
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: {{accent}}">{{rvCur.panel}}</p>
        <h3 style="margin: 0; font-size: clamp(22px, 2.4vw, 30px); font-weight: 600; line-height: 1.15">{{rvCur.label}}</h3>
        <p style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: clamp(22px, 2.2vw, 28px); line-height: 1.25; color: #1B1613">{{rvCur.phrase}}</p>
      </div>
    </div>
  </div>
  <div class="v3-note">
    <p><b>Ваши кнопки будут другими.</b> Пишем их под&#160;ваш проект и&#160;задачи вашей команды.</p>
    <a href="#form">Разобрать мой проект <span aria-hidden="true">→</span></a>
  </div>
</section>

<!-- ═══════════ КАК НАЧИНАЕМ ═══════════ -->
<section id="start" aria-labelledby="start-h" class="v3-sec">
  <div style="display: flex; align-items: flex-start; gap: 20px">
      <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613; margin-top: 0.62em"></span>
      <h2 id="start-h" class="v3-h2">Как начинаем</h2>
    </div>
  <ol class="v3-steps">
    <li><span class="v3-n" aria-hidden="true">01</span><h3>Созвон.</h3><p>Разбираем ваш EIR и&#160;задачи команды.</p></li>
    <li><span class="v3-n" aria-hidden="true">02</span><h3>Пилот.</h3><p>Кнопки на&#160;одном этаже вашей модели.</p></li>
    <li><span class="v3-n" aria-hidden="true">03</span><h3>Весь проект.</h3><p>Кнопки на&#160;все планы и&#160;ведение до&#160;сдачи.</p></li>
  </ol>
  <a class="v3-more" href="/kak-rabotaem/">Подробнее о&#160;том, как мы работаем <span aria-hidden="true">→</span></a>
</section>

<!-- ═══════════ СТОИМОСТЬ ═══════════ -->
<section id="price" aria-labelledby="price-h" class="v3-sec v3-split">
  <div class="v3-side"><div style="display: flex; align-items: flex-start; gap: 20px">
      <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613; margin-top: 0.62em"></span>
      <h2 id="price-h" class="v3-h2">Стоимость</h2>
    </div></div>
  <p class="v3-big">Цену называем после разбора EIR, ТЗ и&#160;модели АР. Она складывается из&#160;шаблона, BEP, кнопок, пилота и&#160;ведения. Тиражируемые этажи бесплатно.</p>
</section>

<!-- ═══════════ FAQ ═══════════ -->
<section id="faq" aria-labelledby="faq-h" class="v3-sec v3-split">
  <div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: flex-start; gap: 20px">
    <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613; margin-top: 18px"></span>
    <h2 id="faq-h" style="margin: 0; font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em">Частые вопросы</h2>
    </div>
    <figure class="q-fig" aria-hidden="true"><div class="q-img"><img src="img/quiet_desk.jpg" alt="" loading="lazy" decoding="async" width="720" height="900"></div></figure>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <sc-for list="{{faq}}" as="q" hint-placeholder-count="7">
      <div style="border-top: 1px solid rgba(27,22,19,0.16)">
        <button type="button" onClick="{{q.toggle}}" aria-expanded="{{q.open}}" style="width: 100%; min-height: 64px; padding: 18px 0; display: flex; justify-content: space-between; align-items: center; gap: 20px; border: 0; background: transparent; color: #1B1613; text-align: left; font-size: clamp(17px, 1.6vw, 19px); font-weight: 500; cursor: pointer">
          <span>{{q.q}}</span>
          <span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(27,22,19,0.2); color: {{accent}}; font-size: 20px; line-height: 1">{{q.sign}}</span>
        </button>
        <sc-if value="{{q.open}}" hint-placeholder-val="{{false}}">
          <p style="margin: 0; padding: 0 56px 22px 0; font-size: 16px; line-height: 1.6; color: #5E544D">{{q.a}}</p>
        </sc-if>
      </div>
    </sc-for>
  </div>
</section>

<div class="v3-fade-up" aria-hidden="true"></div>

<!-- ═══════════ ФОРМА ═══════════ -->
<section id="form" aria-labelledby="form-h" style="position: relative; overflow: hidden; background: #1B1613; color: #F4F4F0">
  <div class="fs-glow" aria-hidden="true" style="position: absolute; left: -25%; top: 10%; width: 90%; height: 120%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,120,47,0.75) 0%, rgba(196,66,30,0.38) 45%, rgba(27,22,19,0) 100%)"></div>
  <div style="position: relative; max-width: 1200px; margin: 0 auto; padding: clamp(64px, 8vw, 120px) clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 64px">
    <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 18px">
      <p style="margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #E8A06A">Консультация · 30 минут</p>
      <h2 id="form-h" style="margin: 0; font-size: clamp(32px, 4.4vw, 58px); font-weight: 600; line-height: 1; text-transform: uppercase">Записаться на&#160;созвон</h2>
      <p style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 26px; line-height: 1.25; color: #F1D9C4">Разберём ваш EIR и&#160;покажем, какие операции стоит отдать кнопкам в&#160;первую очередь.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px">
        <a href="https://t.me/F_Lebedik" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; background: #F4F4F0; color: #1B1613; text-decoration: none; font-weight: 600; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.5 2.8 10.7c-1 .4-1 1.6 0 1.9l4.6 1.5 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.8 3.5c.7.5 1.7.1 1.9-.7L23 4.9c.2-1-.6-1.8-1.5-1.4Z" fill="#1B1613"/><path d="m8 14 9.5-6.5" stroke="#F4F4F0" stroke-width="1.6" stroke-linecap="round"/></svg>Написать в&#160;Telegram</a>
        <span style="font-size: 15px; color: rgba(244,244,240,0.85); user-select: all">+7 950 033-70-66</span>
      </div>
    </div>

    <div style="flex: 999 1 520px; min-width: 0; border-radius: 18px; background: #F4F4F0; color: #1B1613; padding: clamp(22px, 3.4vw, 40px); box-shadow: 0 40px 90px -40px rgba(0,0,0,0.6)">
      <sc-if value="{{formOpen}}" hint-placeholder-val="{{true}}">
        <form novalidate onSubmit="{{formSubmit}}" style="margin: 0; display: flex; flex-direction: column; gap: 20px">
          <p style="margin: 0; font-size: clamp(20px, 2.2vw, 26px); font-weight: 600">Оставьте контакт, мы&#160;перезвоним</p>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5E544D">Имя *
              <input type="text" name="name" autocomplete="name" required value="{{f.name}}" onChange="{{on_name}}" style="min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(27,22,19,0.24); background: #FFFFFF; color: #1B1613; font-size: 16px">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5E544D">Телефон *
              <input type="tel" name="phone" autocomplete="tel" required placeholder="+7 ___ ___-__-__" value="{{f.phone}}" onChange="{{on_phone}}" style="min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(27,22,19,0.24); background: #FFFFFF; color: #1B1613; font-size: 16px">
            </label>
          </div>
          <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; color: #5E544D">Где удобнее связаться</legend>
            <div role="radiogroup" style="display: flex; flex-wrap: wrap; gap: 10px">
              <sc-for list="{{vias}}" as="v" hint-placeholder-count="3">
                <button type="button" role="radio" aria-checked="{{v.pressed}}" onClick="{{v.pick}}" style="min-height: 44px; padding: 8px 18px; border-radius: 999px; border: 1px solid {{v.border}}; background: {{v.bg}}; color: {{v.fg}}; font-size: 15px; cursor: pointer">{{v.label}}</button>
              </sc-for>
            </div>
          </fieldset>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5E544D"><span>Email <span style="opacity: 0.7">· необязательно</span></span>
              <input type="email" name="email" autocomplete="email" placeholder="name@buro.ru" value="{{f.email}}" onChange="{{on_email}}" style="min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(27,22,19,0.24); background: #FFFFFF; color: #1B1613; font-size: 16px">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5E544D"><span>Что хотите ускорить <span style="opacity: 0.7">· необязательно</span></span>
              <input type="text" name="req" placeholder="например, развёртки и ведомости" value="{{f.req}}" onChange="{{on_req}}" style="min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(27,22,19,0.24); background: #FFFFFF; color: #1B1613; font-size: 16px">
            </label>
          </div>
          <label style="display: flex; align-items: flex-start; gap: 12px; font-size: 14px; line-height: 1.45; color: #5E544D; cursor: pointer">
            <input type="checkbox" name="consent" required checked="{{f.consent}}" onChange="{{onConsent}}" style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #B5401F">
            <span>Согласен на&#160;обработку персональных данных по&#160;<a href="/privacy/" style="color: #B5401F">политике конфиденциальности</a> *</span>
          </label>
          <sc-if value="{{formError}}" hint-placeholder-val="{{false}}">
            <p role="alert" style="margin: 0; font-size: 14px; color: #A3361A">{{formErrorText}}</p>
          </sc-if>
          <button type="submit" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border-radius: 999px; border: 0; background: #1B1613; color: #F4F4F0; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer">Записаться →</button>
        </form>
      </sc-if>

      <sc-if value="{{formDone}}" hint-placeholder-val="{{false}}">
        <div role="status" style="display: flex; flex-direction: column; gap: 18px">
          <p style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 34px; line-height: 1.1; color: #B5401F">{{f.name}}, форма скоро заработает</p>
          <p style="margin: 0; font-size: 17px; line-height: 1.55">Пока заявки с&#160;сайта не&#160;доходят, поэтому ваши данные никуда не&#160;отправлены. Напишите Фёдору в&#160;Telegram или позвоните, он&#160;ответит сам.</p>

    mMin *= st.people; bMin *= st.people;
    const saved = (mMin - bMin) / 60;
    const calc = { manualH: this.num(mMin / 60), btnH: this.num(bMin / 60), savedH: this.num(Math.round(saved)), days: this.num(Math.round(saved / 8)) };

    const STEPS = [
      { title: 'Выявляем запрос на автоматизацию', text: 'Созваниваемся, разбираем EIR, ТЗ и график. Находим операции, которые съедают больше всего часов вашей команды.' },
      { title: 'Анализируем работу в Revit', text: 'Смотрим, как команда выпускает РД сейчас: какие действия повторяются изо дня в день и где возникают ошибки и возвраты.' },
      { title: 'Предлагаем автоматизацию', text: 'Описываем, какие кнопки нужны, что делает каждая и какую ручную работу она забирает на себя.' },
      { title: 'Выпускаем прототип', text: 'Первая версия кнопки на вашей модели: на эталонном этаже или одном корпусе.' },
      { title: 'Тестируем в полевых условиях', text: 'Команда работает с кнопкой на живом проекте, а мы собираем замечания и замеряем время.' },
      { title: 'Корректируем кнопку', text: 'Правим логику под ваш EIR, ваши стандарты и привычки команды.' },
      { title: 'Выпускаем финальную версию', text: 'Стабильная версия с лицензионным ключом на проект и конфигом под EIR.' },
      { title: 'Обучаем пользоваться', text: 'Показываем команде, как работать с кнопками, и остаёмся на связи до сдачи.' }
    ];
    const steps = STEPS.map((s, i) => {
      const on = st.step === i, past = i < st.step;
      return {
        num: String(i + 1).padStart(2, '0'), title: s.title, pressed: on ? 'true' : 'false', arrow: i < STEPS.length - 1 ? '→' : '',
        bg: on ? '#1B1613' : (past ? '#F4F4F0' : 'transparent'), fg: on ? '#F4F4F0' : '#1B1613',
        border: on ? '#1B1613' : 'rgba(27,22,19,0.18)', numFg: on ? '#E8A06A' : accent,
        pick: () => self.setState({ step: i })
      };
    });
    const step = { num: String(st.step + 1).padStart(2, '0'), title: STEPS[st.step].title, text: STEPS[st.step].text };
    const weeks = [
      { when: 'неделя 1', title: 'Бриф и EIR', text: 'Разбираем EIR, ТЗ и график, получаем модель АР и образцы.' },
      { when: 'недели 1–2', title: 'Шаблон и BEP', text: 'Шаблон под EIR, BEP на согласование заказчику.' },
      { when: 'недели 2–3', title: 'Кнопки и пилот', text: 'Ставим кнопки, обучаем команду, вместе оформляем эталонный этаж.' },
      { when: 'до сдачи', title: 'Ведение', text: 'Тиражирование этажей, выгрузки, коллизии и замечания заказчика.' }
    ];
    const procSteps = st.proc === 'steps';

    const CASES = {
      demo: { tag: 'Демо-пример · [плейсхолдер]', title: 'РД АИ жилого комплекса: [N] корпуса, [N] этажей',
        task: 'Интерьеры МОП по EIR девелопера, [N] разрабатываемых этажей, остальные тиражируются.',
        done: 'Шаблон под EIR, BEP, кнопки на планы отделки, полов и потолков, самопроверка EIR и тиражирование этажей.',
        before: '[___] ч', after: '[___] ч', note: '[подставим цифры, когда кейс будет согласован]' },
      real: { tag: 'Опыт основателя', title: 'РД АИ жилого комплекса: 3 корпуса, 112 этажей',
        task: 'Интерьеры МОП по EIR крупного московского девелопера, корпус до 59 этажей, 36 разрабатываемых этажей, остальные тиражируются.',
        done: 'Шаблон под EIR с нуля, BEP, 24 кнопки на планы отделки, полов и потолков, самопроверка EIR и тиражирование этажей.',
        before: '[___] ч', after: '[___] ч', note: '[цифры только после реального замера]' }
    };
    const caseData = CASES[caseMode] || CASES.demo;

    const ask = '';
    const priceRows = [
      { name: 'Шаблон под EIR заказчика', price: showPrices ? '60 000 ₽' : ask },
      { name: 'BEP до утверждения', price: showPrices ? '40 000 ₽' : ask },
      { name: 'Кнопки на все планы АИ', price: showPrices ? '[___] ₽' : ask },
      { name: 'Ведение до сдачи', price: showPrices ? '[___] ₽ в месяц' : ask },
      { name: 'Пилот: корпус или эталонный этаж', price: showPrices ? '[100–150] тыс. ₽' : ask }
    ].map(r => Object.assign(r, { color: r.price === ask ? '#5E544D' : accent, hasPrice: !!r.price }));

    const FAQ = [
      { q: 'Что такое «кнопка»?', a: 'Команда на вкладке Flow в Revit. Нажали, и ручная операция выполняется по правилам вашего проекта.' },
      { q: 'У нас свой EIR и свои стандарты. Подойдёт?', a: 'Да. Кнопки настраиваются под EIR проекта, поэтому начинаем с разбора вашего EIR.' },
      { q: 'Можно начать с малого?', a: 'Да, с пилота на одном корпусе или эталонном этаже. Пилот засчитывается в проект.' },
      { q: 'Что с безопасностью наших моделей?', a: 'Кнопки работают у вас в Revit, на вашем компьютере. Модель и данные проекта никуда не отправляются и в нейросети не загружаются. Наружу уходит только то, что вы сами отправите кнопкой «Вопрос»: текст и скриншот. ИИ помогает нам писать кнопки, а не читать ваш проект. Всё это закрепляем в договоре.' },
      { q: 'Что если по кнопке появится вопрос?', a: 'Спросите прямо из Revit: кнопка «Вопрос» отправляет его автору, ответ приходит туда же в течение двух часов. Всё общение внутри плагина, не выходя из Revit.' }
    ];
    const faq = FAQ.map((x, i) => ({ q: x.q, a: x.a, open: st.faqOpen === i, sign: st.faqOpen === i ? '−' : '+',
      toggle: () => self.setState({ faqOpen: self.state.faqOpen === i ? -1 : i }) }));

    const TASKS = ['Отделка и ведомости', 'Развёртки', 'Проверка по EIR', 'Тиражирование этажей', 'Шаблон и BEP', 'Пока не знаю, нужен разбор'];
    const tasks = TASKS.map(t => {
      const on = st.tasks.indexOf(t) >= 0;
      return { label: t, pressed: on ? 'true' : 'false', bg: on ? '#1B1613' : 'transparent', fg: on ? '#F4F4F0' : '#1B1613', border: on ? '#1B1613' : 'rgba(27,22,19,0.24)',
        pick: () => { const cur = self.state.tasks; self.setState({ err: '', tasks: on ? cur.filter(x => x !== t) : cur.concat([t]) }); } };
    });
    const SIZES = ['до 10', '10–30', '30–100', 'больше 100'];
    const sizes = SIZES.map(z => {
      const on = st.size === z;
      return { label: z, pressed: on ? 'true' : 'false', bg: on ? '#1B1613' : 'transparent', fg: on ? '#F4F4F0' : '#1B1613', border: on ? '#1B1613' : 'rgba(27,22,19,0.24)',
        pick: () => self.setState({ size: z, err: '' }) };
    });

    const formSubmit = e => {
      if (e && e.preventDefault) e.preventDefault();
      const f = self.state.f;
      if (!f.name.trim()) return self.setState({ err: 'Напишите, как к вам обращаться.' });
      if (f.phone.replace(/\D/g, '').length < 10) return self.setState({ err: 'Проверьте телефон: нужно не меньше 10 цифр.' });
      if (f.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) return self.setState({ err: 'Проверьте email или оставьте поле пустым.' });
      if (!f.consent) return self.setState({ err: 'Нужно согласие на обработку персональных данных.' });
      self.lead = self.buildLead(roleObj.label);
      return self.setState({ done: true, err: '' });
    };
    const vias = VIAS.map(v => {
      const on = st.f.via === v.id;
      return { label: v.label, pressed: on ? 'true' : 'false', border: on ? '#1B1613' : 'rgba(27,22,19,0.24)', bg: on ? '#1B1613' : 'transparent', fg: on ? '#F4F4F0' : '#1B1613',
        pick: () => self.setF('via', v.id) };
    });

    const f = st.f;
    const viaObj = VIAS.find(v => v.id === f.via);
    const summary = {
      contact: [f.phone, viaObj ? 'связь: ' + viaObj.label : '', f.email].filter(Boolean).join(' · '),
      req: f.req.trim() || 'запрос обсудим на созвоне'
    };

    return {
      accent,
      roles, roleLine: roleObj.line, heroOps, pains, ribbon, op, rvTabs, rvPanels, rvCur, rvPad,
      calcOps, people: st.people, calc,
      incPeople: () => self.setState({ people: Math.min(200, self.state.people + 1) }),
      decPeople: () => self.setState({ people: Math.max(1, self.state.people - 1) }),
      procSteps, procWeeks: !procSteps,
      procStepsBg: procSteps ? '#1B1613' : 'transparent', procStepsFg: procSteps ? '#F4F4F0' : '#1B1613',
      procWeeksBg: !procSteps ? '#1B1613' : 'transparent', procWeeksFg: !procSteps ? '#F4F4F0' : '#1B1613',
      showSteps: () => self.setState({ proc: 'steps' }), showWeeks: () => self.setState({ proc: 'weeks' }),
      steps, step, weeks,
      prevStep: () => self.setState({ step: (self.state.step + 7) % 8 }),
      nextStep: () => self.setState({ step: (self.state.step + 1) % 8 }),
      caseOn: caseMode !== 'hidden', caseData,
      priceRows, pilotPrice: showPrices ? ' за [100–150] тыс. ₽' : '',
      faq,
      formOpen: !LEAD_FORM_URL && !st.done, formDone: !LEAD_FORM_URL && st.done,
      formIframe: !!LEAD_FORM_URL, leadUrl: LEAD_FORM_URL, frameStyle: st.frameH ? 'height: ' + st.frameH + 'px' : '',
      fs0: st.fstep === 0, fs1: st.fstep === 1, fs2: st.fstep === 2, fs3: st.fstep === 3,
      stepNum: st.fstep + 1, canBack: st.fstep > 0, isFirst: st.fstep === 0,
      nextLabel: st.fstep === 3 ? 'Записаться →' : 'Дальше →',
      formDots: [0, 1, 2, 3].map(i => ({ bg: i <= st.fstep ? '#B5401F' : 'rgba(27,22,19,0.14)' })),
      tasks, sizes, f, summary,
      formError: !!st.err, formErrorText: st.err,
      formSubmit, vias,
      formEdit: () => self.setState({ done: false }),
      on_name: e => self.setF('name', e.target.value),
      on_phone: e => self.setF('phone', e.target.value),
      on_email: e => self.setF('email', e.target.value),
      on_req: e => self.setF('req', e.target.value),
      onConsent: e => self.setF('consent', e.target.checked),
      stickyOn: sticky && st.scrolled && !st.done
    };
  }
}
DCLite.mount(Component, document.getElementById('app'), document.getElementById('tpl'), {"accent": "#B5401F", "showPrices": false, "caseMode": "hidden", "stickyButton": true, "$preview": null});
</script>
</body>
</html>
