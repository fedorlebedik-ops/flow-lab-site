<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Lab (Флоу Лаб) — лаборатория автоматизации Revit для архитектурных бюро</title>
<meta name="description" content="Flow Lab (Флоу Лаб) — лаборатория автоматизации Revit для архитектурных бюро: изучаем процесс команды, настраиваем кнопки под EIR девелопера и замеряем время до и после.">
<link rel="canonical" href="https://flow-lab.pro/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="Flow Lab">
<meta property="og:title" content="Flow Lab (Флоу Лаб) — лаборатория автоматизации Revit">
<meta property="og:description" content="Рабочая документация в Revit на кнопках под EIR девелопера. Изучаем процесс команды, настраиваем кнопки под ваши правила, замеряем время до и после.">
<meta property="og:url" content="https://flow-lab.pro/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&amp;display=swap">
<style>
body{margin:0;background:#EDE8E2;color:#1B1613;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
a{color:#B5401F}a:hover{color:#8E2F15}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #E8A06A;outline-offset:3px}
.fs-glow{animation:fsBreath 9s ease-in-out infinite alternate}
@keyframes fsBreath{from{transform:scale(1) translate(0,0);opacity:.92}to{transform:scale(1.12) translate(3%,-2%);opacity:1}}
@media (prefers-reduced-motion:reduce){.fs-glow{animation:none}html{scroll-behavior:auto}}
@media (max-width:860px){.fs-links{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: #EDE8E2; color: #1B1613; font-family: 'Onest', system-ui, sans-serif; overflow-x: hidden; min-width: 0">

<!-- ═══════════ HERO ═══════════ -->
<header style="position: relative; overflow: hidden; background: #1B1613; color: #F4F4F0">
  <div class="fs-glow" aria-hidden="true" style="position: absolute; left: -18%; bottom: -55%; width: 95%; height: 140%; border-radius: 50%; background: radial-gradient(closest-side, #F0782F 0%, #C4421E 32%, rgba(140,40,14,0.55) 60%, rgba(27,22,19,0) 100%); filter: blur(10px); pointer-events: none"></div>
  <div class="fs-glow" aria-hidden="true" style="position: absolute; right: -20%; top: -40%; width: 60%; height: 90%; border-radius: 50%; background: radial-gradient(closest-side, rgba(232,160,106,0.35) 0%, rgba(196,66,30,0.18) 45%, rgba(27,22,19,0) 100%); pointer-events: none"></div>

  <nav aria-label="Главное меню" style="position: relative; max-width: 1200px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <a href="#top" style="color: #F4F4F0; text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase">Flow&#160;Lab</a>
    <div class="fs-links" style="display: flex; gap: 28px; align-items: center; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">
      <a href="#buttons" style="color: rgba(244,244,240,0.78); text-decoration: none">Кнопки</a>
      <a href="#calc" style="color: rgba(244,244,240,0.78); text-decoration: none">Калькулятор</a>
      <a href="#process" style="color: rgba(244,244,240,0.78); text-decoration: none">Процесс</a>
      <a href="#price" style="color: rgba(244,244,240,0.78); text-decoration: none">Стоимость</a>
      <a href="#faq" style="color: rgba(244,244,240,0.78); text-decoration: none">Вопросы</a>
    </div>
    <a href="#form" style="color: #1B1613; background: #F4F4F0; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 13px 20px; border-radius: 999px; white-space: nowrap">Созвон →</a>
  </nav>

  <div id="top" style="position: relative; max-width: 1200px; margin: 0 auto; padding: clamp(48px, 9vw, 120px) clamp(16px, 4vw, 48px) clamp(64px, 10vw, 140px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end">
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <p style="margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #E8A06A">[ лаборатория автоматизации Revit для архитектурных бюро ]</p>
      <h1 style="margin: 0; font-weight: 600; font-size: clamp(34px, 6.6vw, 92px); line-height: 0.98; letter-spacing: 0.01em; text-transform: uppercase">Рабочая документация в&#160;Revit на&#160;кнопках</h1>
      <p style="margin: 0; max-width: 640px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: clamp(22px, 2.6vw, 32px); line-height: 1.22; color: #F1D9C4">Под EIR девелопера: модель проходит проверку заказчика, а&#160;команда занимается проектом, а&#160;не&#160;рутиной.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 10px 0; max-width: 680px; font-size: 14px; line-height: 1.4; color: rgba(244,244,240,0.9)">
        <span style="flex: 1 1 100%; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,244,240,0.7)">Лаборатория, а&#160;не&#160;коробка с&#160;плагином</span>
        <span style="flex: 1 1 180px; padding: 12px 16px 12px 0; border-top: 1px solid rgba(244,244,240,0.22)"><b style="color: #E8A06A; font-weight: 600">01</b> Изучаем, как работает ваша команда и&#160;ваш EIR</span>
        <span style="flex: 1 1 180px; padding: 12px 16px 12px 0; border-top: 1px solid rgba(244,244,240,0.22)"><b style="color: #E8A06A; font-weight: 600">02</b> Настраиваем кнопки под ваши правила</span>
        <span style="flex: 1 1 180px; padding: 12px 16px 12px 0; border-top: 1px solid rgba(244,244,240,0.22)"><b style="color: #E8A06A; font-weight: 600">03</b> Замеряем время до&#160;и&#160;после</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 8px">
        <p style="margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,244,240,0.7)">Кто вы в бюро?</p>
        <div role="group" aria-label="Выберите роль" style="display: flex; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
            <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1px solid {{r.heroBorder}}; background: {{r.heroBg}}; color: {{r.heroFg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{r.label}}</button>
          </sc-for>
        </div>
        <p style="margin: 0; max-width: 600px; font-size: 16px; line-height: 1.55; color: rgba(244,244,240,0.86); min-height: 50px">{{roleLine}}</p>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; margin-top: 4px">
        <a href="#form" style="display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 30px; border-radius: 999px; background: #E8A06A; color: #1B1613; text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase">Записаться на созвон <span aria-hidden="true">→</span></a>
        <a href="#calc" style="color: #F4F4F0; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; text-underline-offset: 6px">Посчитать экономию</a>
      </div>
    </div>

    <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0 0 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 22px; color: #E8A06A">вручную → кнопкой</p>
      <sc-for list="{{heroOps}}" as="o" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 16px 0; border-top: 1px solid rgba(244,244,240,0.22)">
          <span style="font-size: 14px; line-height: 1.35; color: rgba(244,244,240,0.86)">{{o.short}}</span>
          <span style="white-space: nowrap; font-size: 15px; font-weight: 500"><span style="color: rgba(244,244,240,0.6)">{{o.manualTxt}}</span> <span style="color: #E8A06A">→ {{o.btnTxt}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>
</header>

<!-- ═══════════ КОРОТКО О ГЛАВНОМ ═══════════ -->
<section aria-labelledby="sum-h" style="max-width: 1200px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 64px">
  <div style="flex: 1 1 280px; display: flex; align-items: flex-start; gap: 20px">
    <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613; margin-top: 18px"></span>
    <h2 id="sum-h" style="margin: 0; font-size: clamp(26px, 3vw, 36px); line-height: 1.05; font-weight: 600; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em">Коротко о&#160;главном →</h2>
  </div>
  <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 22px; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5">
    <p style="margin: 0">Девелоперы требуют модель по&#160;своему EIR: коды, параметры, рабочие наборы, оформление по&#160;ГОСТ. Модель проверяют до&#160;приёмки комплекта.</p>
    <p style="margin: 0">Корпуса растут до&#160;60 этажей. Эталонный этаж оформляют один раз, а&#160;потом его нужно повторить на&#160;десятках этажей без ошибок. Команда тратит недели на&#160;перекладывание параметров вместо проекта.</p>
    <p style="margin: 0; color: {{accent}}; font-weight: 500">Мы настраиваем шаблон и&#160;BEP под ваш EIR, ставим кнопки на&#160;все планы АИ и&#160;ведём модель до&#160;сдачи.</p>
  </div>
</section>

<!-- ═══════════ ПРОБЛЕМА → РЕШЕНИЕ ═══════════ -->
<section aria-labelledby="pain-h" style="background: #F4F4F0">
  <div style="max-width: 1200px; margin: 0 auto; padding: clamp(64px, 8vw, 110px) clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; align-items: center; gap: 20px">
      <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613"></span>
      <h2 id="pain-h" style="margin: 0; font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em">Ваша боль → что делает кнопка</h2>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{pains}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: baseline; padding: 26px 0; border-top: 1px solid rgba(27,22,19,0.16)">
          <p style="margin: 0; flex: 1 1 280px; font-size: clamp(17px, 1.5vw, 19px); line-height: 1.45">{{p.pain}}</p>
          <span aria-hidden="true" style="flex: none; font-size: 22px; color: {{accent}}">→</span>
          <div style="flex: 1.3 1 320px; display: flex; flex-direction: column; gap: 6px">
            <p style="margin: 0; font-weight: 600; font-size: 16px">{{p.fix}}</p>
            <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E544D">{{p.detail}}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<!-- ═══════════ ГЛОУ-РАЗДЕЛИТЕЛЬ ═══════════ -->
<div aria-hidden="true" style="position: relative; overflow: hidden; background: #1B1613; height: clamp(220px, 30vw, 380px)">
  <div class="fs-glow" style="position: absolute; left: -10%; top: -30%; width: 80%; height: 160%; border-radius: 50%; background: radial-gradient(closest-side, #F0782F 0%, #C4421E 35%, rgba(120,34,12,0.5) 62%, rgba(27,22,19,0) 100%); filter: blur(8px)"></div>
  <div style="position: relative; height: 100%; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; align-items: center; justify-content: flex-end">
    <span style="color: #F4F4F0; font-weight: 600; font-size: clamp(34px, 6vw, 80px); letter-spacing: 0.02em; text-transform: uppercase">Решение →</span>
  </div>
</div>

<!-- ═══════════ ЛЕНТА REVIT ═══════════ -->
<section id="buttons" aria-labelledby="rib-h" style="max-width: 1200px; margin: 0 auto; padding: clamp(64px, 8vw, 110px) clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">
  <div style="display: flex; flex-wrap: wrap; gap: 20px 64px; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 20px">
      <span aria-hidden="true" style="flex: none; width: 56px; height: 1px; background: #1B1613"></span>
      <h2 id="rib-h" style="margin: 0; font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em">Вкладка Flow в&#160;вашем Revit</h2>
    </div>
    <p style="margin: 0; max-width: 420px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 24px; line-height: 1.25; color: #5E544D">Нажмите на&#160;кнопку на&#160;ленте и&#160;посмотрите, сколько времени она забирает на&#160;себя.</p>
  </div>

  <!-- макет окна -->
  <div style="border-radius: 14px; overflow: hidden; background: #F4F4F0; box-shadow: 0 30px 80px -40px rgba(60,30,15,0.45), 0 0 0 1px rgba(27,22,19,0.1)">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #2A221D; color: rgba(244,244,240,0.75); font-size: 12px">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #C4421E"></span>
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #E8A06A"></span>
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #8C7F74"></span>
      <span style="margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Autodesk Revit · Демо-модель.rvt · План 3 этажа</span>
    </div>
    <div style="overflow-x: auto; background: #E4DDD5; border-bottom: 1px solid rgba(27,22,19,0.12)">
      <div style="display: flex; gap: 2px; padding: 0 10px; font-size: 13px; white-space: nowrap; min-width: max-content">
        <span style="padding: 10px 14px; color: #6F645B">Архитектура</span>
        <span style="padding: 10px 14px; color: #6F645B">Вставка</span>
        <span style="padding: 10px 14px; color: #6F645B">Аннотации</span>
        <span style="padding: 10px 14px; color: #6F645B">Вид</span>
        <span style="padding: 10px 14px; color: #6F645B">Управление</span>
        <span style="padding: 10px 16px; background: #F4F4F0; color: {{accent}}; font-weight: 600; border-radius: 8px 8px 0 0; box-shadow: inset 0 2px 0 {{accent}}">Flow</span>
      </div>
    </div>
    <div style="overflow-x: auto; background: #F4F4F0">
      <div role="toolbar" aria-label="Кнопки Flow" style="display: flex; gap: 8px; padding: 14px 14px 10px; min-width: max-content">
        <sc-for list="{{ribbon}}" as="b" hint-placeholder-count="5">
          <button type="button" onClick="{{b.pick}}" aria-pressed="{{b.pressed}}" style="width: 112px; min-height: 96px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 10px; border: 1px solid {{b.border}}; background: {{b.bg}}; color: #1B1613; cursor: pointer; font-size: 12px; line-height: 1.25; text-align: center">
            <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: {{b.iconBg}}; color: {{b.iconFg}}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
            </span>
            <span>{{b.label}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px; padding: 0 14px 10px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6F645B; min-width: max-content">
        <span style="width: 232px; text-align: center; border-top: 1px solid rgba(27,22,19,0.14); padding-top: 6px">Отделка</span>
        <span style="width: 112px; text-align: center; border-top: 1px solid rgba(27,22,19,0.14); padding-top: 6px">Ведомости</span>
        <span style="width: 112px; text-align: center; border-top: 1px solid rgba(27,22,19,0.14); padding-top: 6px">Проверка</span>
        <span style="width: 112px; text-align: center; border-top: 1px solid rgba(27,22,19,0.14); padding-top: 6px">Этажи</span>
      </div>
    </div>

    <!-- результат нажатия -->
    <div style="display: flex; flex-wrap: wrap; gap: 32px 48px; padding: clamp(24px, 4vw, 44px); background: #EDE8E2; border-top: 1px solid rgba(27,22,19,0.1)">
      <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <p style="margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: {{accent}}">Кнопка «{{op.label}}»</p>
        <h3 style="margin: 0; font-size: clamp(22px, 2.4vw, 30px); font-weight: 600; line-height: 1.15">{{op.name}}</h3>
        <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #5E544D">{{op.desc}}</p>
      </div>
      <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 18px; justify-content: center">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Вручную</span><span style="font-weight: 600">{{op.manualTxt}}</span></div>
          <div style="height: 14px; border-radius: 999px; background: rgba(27,22,19,0.08); overflow: hidden"><div style="height: 100%; width: 100%; border-radius: 999px; background: #8C7F74"></div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Кнопкой</span><span style="font-weight: 600; color: {{accent}}">{{op.btnTxt}}</span></div>
          <div style="height: 14px; border-radius: 999px; background: rgba(27,22,19,0.08); overflow: hidden"><div style="height: 100%; width: {{op.btnPct}}; min-width: 14px; border-radius: 999px; background: {{accent}}; transition: width .5s ease"></div></div>
        </div>
        <p style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 26px; color: #1B1613">в&#160;{{op.ratio}} раз быстрее</p>
      </div>
    </div>
  </div>
  <p style="margin: 0; font-size: 13px; color: #6F645B">Макет нарисован для сайта, модель демонстрационная. Время операций из&#160;нашего коммерческого предложения.</p>
</section>

<!-- ═══════════ ЧТО ВХОДИТ ═══════════ -->
<section aria-labelledby="inc-h" style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) clamp(64px, 8vw, 110px); box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
  <h2 id="inc-h" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Что входит во&#160;внедрение</h2>
  <div style="position: relative; overflow: hidden; border-radius: 16px; background: #1B1613; color: #F4F4F0; padding: clamp(28px, 4vw, 52px)">
    <div class="fs-glow" aria-hidden="true" style="position: absolute; right: -20%; top: -60%; width: 75%; height: 220%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,120,47,0.85) 0%, rgba(196,66,30,0.45) 40%, rgba(27,22,19,0) 100%)"></div>
    <div style="position: relative; max-width: 640px; display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #E8A06A">Основа продукта</p>
      <p style="margin: 0; font-size: clamp(26px, 3.2vw, 40px); font-weight: 600; line-height: 1.1">Кнопки на&#160;все планы раздела АИ</p>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: rgba(244,244,240,0.85)">Отделка, полы, потолки, плинтусы и&#160;профили, мебель, двери и&#160;люки, свет, развёртки, ведомости, листы, тиражирование этажей, самопроверка EIR. Именно они сокращают часы.</p>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">

<script>
/* Мини-движок шаблона: {{путь}}, <sc-for list as>, <sc-if value>, onClick/onChange. Без внешних зависимостей. */
(function(){
  function look(scope, expr){
    expr = expr.trim();
    if (expr === 'true') return true; if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return +expr;

  var RE = /\{\{([^}]*)\}\}/g;

      list.forEach(function(item){ var s = Object.create(scope); s[as] = item; kids(node, s, out); });
      return;
    }
    if (tag === 'sc-if'){ if (interp(node.getAttribute('value'), scope)) kids(node, scope, out); return; }
    var v = {t: tag, a: {}, on: {}, p: {}, c: []};

      var at = node.attributes[i], n = at.name;
      if (n.indexOf('hint-') === 0) continue;
      var val = interp(at.value, scope);
      if (n === 'onclick') v.on.click = val;
      else if (n === 'onchange') v.on.change = val;
      else if (n === 'checked') v.p.checked = !!val;
      else if (n === 'value' && (tag === 'input' || tag === 'textarea')) v.p.value = val == null ? '' : String(val);
      else if (val === false || val == null) continue;
      else v.a[n] = val === true ? (n.indexOf('aria-') === 0 ? 'true' : '') : String(val);

      prevStep: () => self.setState({ step: (self.state.step + 7) % 8 }),
      nextStep: () => self.setState({ step: (self.state.step + 1) % 8 }),
      caseOn: caseMode !== 'hidden', caseData,
      priceRows, pilotPrice: showPrices ? ' за [100–150] тыс. ₽' : '',
      faq,
      formOpen: !st.done, formDone: st.done,
      fs0: st.fstep === 0, fs1: st.fstep === 1, fs2: st.fstep === 2, fs3: st.fstep === 3,
      stepNum: st.fstep + 1, canBack: st.fstep > 0, isFirst: st.fstep === 0,
      nextLabel: st.fstep === 3 ? 'Записаться →' : 'Дальше →',
      formDots: [0, 1, 2, 3].map(i => ({ bg: i <= st.fstep ? '#B5401F' : 'rgba(27,22,19,0.14)' })),
      tasks, sizes, f, summary,
      formError: !!st.err, formErrorText: st.err,
      formNext, formBack: () => self.setState({ fstep: Math.max(0, self.state.fstep - 1), err: '' }),
      formEdit: () => self.setState({ done: false, fstep: 3 }),
      on_name: e => self.setF('name', e.target.value),
      on_company: e => self.setF('company', e.target.value),
      on_when: e => self.setF('when', e.target.value),
      on_city: e => self.setF('city', e.target.value),
      on_phone: e => self.setF('phone', e.target.value),
      on_tg: e => self.setF('tg', e.target.value),
      on_email: e => self.setF('email', e.target.value),
      on_dev: e => self.setF('dev', e.target.value),
      on_revit: e => self.setF('revit', e.target.value),
      on_req: e => self.setF('req', e.target.value),
      onConsent: e => self.setF('consent', e.target.checked),
      stickyOn: sticky && st.scrolled && !st.done
    };
  }
}
DCLite.mount(Component, document.getElementById('app'), document.getElementById('tpl'), {"accent": "#B5401F", "showPrices": false, "caseMode": "demo", "stickyButton": true, "$preview": null});
</script>
